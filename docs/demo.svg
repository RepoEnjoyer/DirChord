<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">DirChord comparison report</title>
  <desc id="desc">A terminal window showing modified, moved, and added files in a sample game pack</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="960" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142039"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#02040a" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="960" height="500" rx="28" fill="#070a11"/>
  <circle cx="95" cy="78" r="90" fill="#193c3e" opacity=".42"/>
  <circle cx="875" cy="420" r="140" fill="#152c51" opacity=".5"/>
  <g filter="url(#shadow)">
    <rect x="66" y="48" width="828" height="404" rx="18" fill="url(#frame)" stroke="#2b3850" stroke-width="2"/>
    <path d="M66 104h828" stroke="#2b3850" stroke-width="2"/>
    <circle cx="100" cy="77" r="7" fill="#ff7c86"/>
    <circle cx="124" cy="77" r="7" fill="#ffcf70"/>
    <circle cx="148" cy="77" r="7" fill="#64e6b4"/>
    <text x="480" y="84" fill="#93a2b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" text-anchor="middle">dirchord compare Pack-v1 Pack-v2</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="105" y="146" fill="#64e6b4" font-size="20" font-weight="700" letter-spacing="3">DIRCHORD</text>
    <text x="105" y="176" fill="#a9b6c9" font-size="16">Pack-v1  &lt;-&gt;  Pack-v2</text>
    <text x="105" y="224" fill="#ffcf70" font-size="18" font-weight="700">Differences found</text>
    <text x="105" y="254" fill="#93a2b8" font-size="15">1 modified  |  1 moved  |  1 added  |  0 removed  |  1 unchanged</text>
    <text x="105" y="306" fill="#ffcf70" font-size="18" font-weight="700">~</text>
    <text x="136" y="306" fill="#e8edf6" font-size="16">config/settings.json</text>
    <text x="105" y="344" fill="#79bfff" font-size="18" font-weight="700">&gt;</text>
    <text x="136" y="344" fill="#e8edf6" font-size="16">assets/menu.ogg  -&gt;  assets/music/menu.ogg</text>
    <text x="105" y="382" fill="#64e6b4" font-size="18" font-weight="700">+</text>
    <text x="136" y="382" fill="#e8edf6" font-size="16">resourcepacks/ember-ui.zip</text>
  </g>
</svg>
